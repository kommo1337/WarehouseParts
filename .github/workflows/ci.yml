name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    env:
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore (locked)
        run: dotnet restore WarehouseParts.slnx --locked-mode

      - name: Build
        run: dotnet build WarehouseParts.slnx --no-restore

      - name: Test
        run: dotnet test WarehouseParts.slnx --no-build --logger trx

      - name: NuGet audit
        run: |
          dotnet list WarehouseParts.slnx package --vulnerable --include-transitive
          dotnet list WarehouseParts/WarehouseParts.csproj package --vulnerable --include-transitive

      - name: Publish (win-x64)
        run: dotnet publish WarehouseParts/WarehouseParts.csproj -c Release -r win-x64 --self-contained -o publish/win-x64

      - name: Проверка нативной SQLite в publish-артефакте
        shell: pwsh
        run: |
          $dll = Resolve-Path "publish/win-x64/e_sqlite3.dll"
          $code = @"
          using System.Runtime.InteropServices;
          public static class NativeCheck {
              [DllImport(@"$dll", EntryPoint = "sqlite3_libversion")]
              public static extern System.IntPtr sqlite3_libversion();
          }
          "@
          Add-Type -TypeDefinition $code
          $ptr = [NativeCheck]::sqlite3_libversion()
          $version = [Runtime.InteropServices.Marshal]::PtrToStringAnsi($ptr)
          Write-Host "SQLite version in publish: $version"
          $major = [int]($version -split '\.')[0]
          $minor = [int]($version -split '\.')[1]
          $patch = [int]($version -split '\.')[2]
          if ($major -lt 3 -or ($major -eq 3 -and $minor -lt 50) -or ($major -eq 3 -and $minor -eq 50 -and $patch -lt 2)) {
              throw "publish содержит SQLite $version, требуется 3.50.2 или новее"
          }
